spring:
  application:
    name: realtime-fraud-scoring
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fraud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway migrations
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 100
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: fraud-scoring
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.sneha.fraud.api.TransactionRequest
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.sneha.fraud.api
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

fraud:
  topics:
    transactions: transactions
    decisions: fraud-decisions
  thresholds:
    review: 40
    block: 70

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
